[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-studio-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20", "pikepdf>=9,<11", "pypdf>=6,<7", "pyclipr>=0.1.8,<0.2", "shapely>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
